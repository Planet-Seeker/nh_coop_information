name: 주소 API 확인(임시)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 진단
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/probe_fnco.py

name: 조합 주소 원자료 받기
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: fetch-address
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 금융회사기본정보에서 협동조합 목록 받기
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/fetch_fnco_coops.py
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/meta/fnco_coops.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -q -m "조합 주소 원자료 갱신(금융위원회_금융회사기본정보)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          fi

name: 농협 데이터 갱신

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 (KST)
  workflow_dispatch:
    inputs:
      max_new:
        description: "이번에 새로 받을 기준년월 수(반기)"
        required: false
        default: "40"
      bas_ym:
        description: "특정 기준년월만 다시 받기(YYYY06/YYYY12). 보통은 비워 둠"
        required: false
        default: ""
      probe:
        description: "진단 모드(표 구성만 확인, 저장 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: API 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          MAX_NEW: ${{ github.event.inputs.max_new || '4' }}
          MAX_MINUTES: "300"   # 이 시간이 지나면 새 반기를 시작하지 않고 저장 후 종료(작업 제한 350분)
          BAS_YM: ${{ github.event.inputs.bas_ym }}
          PROBE: ${{ github.event.inputs.probe }}
        run: python scripts/collect.py

      - name: 순위용 지표 파일 생성
        if: ${{ !cancelled() && github.event.inputs.probe != 'true' }}
        run: python scripts/build_metrics.py

      - name: 변경분 커밋
        if: ${{ !cancelled() }}   # 수집이 중간에 실패해도 받은 데까지는 저장
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "데이터 갱신: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git pull -q --rebase origin main
            git push -q
          fi

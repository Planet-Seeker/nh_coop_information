name: 농협 일반현황 데이터 갱신

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 (KST)
  workflow_dispatch:
    inputs:
      bas_ym:
        description: "수집할 기준년월(YYYYMM). 비우면 최신 월 자동 탐색"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: API 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          BAS_YM: ${{ github.event.inputs.bas_ym }}
        run: python scripts/fetch_gene.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git push
          fi
